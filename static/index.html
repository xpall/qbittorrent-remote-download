<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Remote Download</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 3v11m0 0l-4-4m4 4l4-4M5 20h14' stroke='%233b6fe0' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("qbt-theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark" ? stored : (dark ? "dark" : "light");
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-head">
    <div>
      <h1>Remote Download</h1>
      <p class="muted">Add torrents to the Jellyfin machine without touching it.</p>
    </div>
    <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/>
      </svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <div id="banner" class="banner hidden" role="status"></div>

  <main>
    <section class="card">
      <form id="add-form" novalidate>
        <div id="entries" class="entries"></div>
        <div class="form-actions">
          <button type="button" id="add-row" class="btn secondary">+ Add another</button>
          <button type="submit" id="submit" class="btn primary">Add download(s)</button>
        </div>
      </form>
      <div id="results" class="results hidden" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Downloads</h2>
        <div class="section-actions">
          <span id="updated" class="muted"></span>
          <button type="button" id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66"/>
              <path d="M20 5v6h-6"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="downloads" class="downloads">
        <p class="muted empty">Nothing added yet.</p>
      </div>
    </section>
  </main>

  <template id="entry-template">
    <div class="entry">
      <div class="entry-head">
        <div class="segmented" role="group" aria-label="Media type">
          <button type="button" class="seg" data-type="movies">Movies</button>
          <button type="button" class="seg" data-type="shows">Shows</button>
        </div>
        <button type="button" class="icon-btn remove" title="Remove entry" aria-label="Remove entry">×</button>
      </div>
      <label>
        <span>Magnet link</span>
        <textarea class="magnet" rows="3" placeholder="magnet:?xt=urn:btih:…" autocomplete="off" spellcheck="false"></textarea>
      </label>
      <label>
        <span>Folder name</span>
        <input class="folder" type="text" placeholder="Dune Part Two (2024)" autocomplete="off">
      </label>
      <label>
        <span>File name <em>· optional</em></span>
        <input class="file" type="text" placeholder="Dune Part Two (2024)" autocomplete="off">
      </label>
      <p class="entry-error hidden"></p>
    </div>
  </template>

  <template id="download-template">
    <article class="download">
      <div class="download-head">
        <h3 class="title"></h3>
        <span class="badge"></span>
      </div>
      <div class="progress"><div class="progress-fill"></div></div>
      <div class="meta">
        <span class="percent"></span>
        <span class="speed"></span>
        <span class="eta"></span>
      </div>
      <p class="status"></p>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
